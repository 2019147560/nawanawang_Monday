name: 고립·은둔 청년 블로그 글 생성

on:
  workflow_dispatch:
    inputs:
      tone:
        description: "글의 방향"
        required: true
        default: "공감형"
        type: choice
        options:
          - 공감형
          - 정보형
          - 희망형
      keywords:
        description: "키워드 (쉼표로 구분)"
        required: true
        default: "사회적 고립,관계 단절"
      length:
        description: "목표 글자 수"
        required: true
        default: "3500"
      output_file:
        description: "저장 파일 경로"
        required: false
        default: "output/blog_post.md"

  schedule:
    - cron: "0 0 * * 1"  # 매주 월요일 09:00 KST

  push:
    branches: [main]
    paths:
      - "new_blog.py"
      - ".github/workflows/new_gen.yml"

jobs:
  generate:
    name: 블로그 글 생성
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 블로그 글 생성
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:            ${{ secrets.EMAIL_TO }}
          BLOG_TONE:           ${{ github.event.inputs.tone     || '공감형' }}
          BLOG_KEYWORDS:       ${{ github.event.inputs.keywords || '사회적 고립,관계 단절,정신건강' }}
          BLOG_LENGTH:         ${{ github.event.inputs.length   || '3500' }}
          OUTPUT_FILE:         ${{ github.event.inputs.output_file || 'output/blog_post.md' }}
        run: python new_blog.py

      - name: 생성된 파일 아티팩트로 업로드
        uses: actions/upload-artifact@v4
        with:
          name: blog-post-${{ github.run_number }}
          path: output/
          retention-days: 30

      - name: 생성된 파일을 저장소에 커밋
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add output/
          git diff --staged --quiet || git commit -m "docs: 블로그 글 자동 생성 (#${{ github.run_number }})"
          git push
